# M0 の確認用: プラグインを読み込めて、プロセスを HTTP から呼べることを確かめる (scripts/smoke_test.py が使う)
"name": "mapper_gmapping_smoke"
"option":
  "http_broker":
    "start": true
    "port": 8001
"plugins":
  "components":
    "mapper_gmapping":
      "language": "c++"
      "path": "plugins/{target}"
"processes":
  - "type_name": "mapper_gmapping_version"
    "name": "version0"
