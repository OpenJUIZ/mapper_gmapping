# .juizapp のマニフェスト(juiz docs/spec/app-package.md §4)。languages・targets・files は juiz pack が書き足す
format: 1
name: mapper_gmapping
version: 0.3.1
kind: app
description: "GMapping SLAM: builds a map from LiDAR scans and odometry (works with mobile_sim)"
license: MIT OR Apache-2.0
homepage: https://github.com/OpenJUIZ/mapper_gmapping
# C++ のプラグインは C ABI で、libjuiz_sdk を同梱する。確かめた juiz の版に合わせる(CMakeLists.txt の juiz_sdk と揃える)
juiz: "=0.2.2"
entry: app.conf
# mobile_sim の odom・scan・lidar_mount トピックを使う(0.3.0 から)。0.3.1 から odom0 に System をまたぐ Transform を張る。juiz run が ipc://mobile_sim を subsystem に足して版を確かめる
depends:
  mobile_sim: ">=0.3.1, <0.4"
