# mapper_gmapping の起動設定
#   先に mobile_sim を IPC 名 mobile_sim で動かしておく(juiz run mobile_sim、または juiz -f app.conf -d --ipc mobile_sim)
#   開発中: scripts/dev_plugin.sh build でプラグインを app/plugins/<target>/ に置いてから
#           juiz -f app/app.conf -d
#   mobile_sim のトピック odom(Pose2DStamped)と scan(LaserScan)を受けて地図を作る
"name": "mapper_gmapping"
"option":
  "http_broker":
    "start": true
    "port": 8001
    # ブラウザ画面(conf のディレクトリからの相対)
    "static_filepaths":
      "/": "web"
# mobile_sim からトピックを受けるため、こちらも IPC ブローカーを持つ
"brokers":
  - "type_name": "ipc"
    "name": "mapper_gmapping"
# mobile_sim につなぐ。パッケージ(juizapp.yaml の depends)で起動するときは juiz run が足す
"subsystems":
  - "type_name": "ipc"
    "name": "mobile_sim"
"plugins":
  "components":
    "mapper_gmapping":
      "language": "c++"
      "path": "plugins/{target}"
"containers":
  - "type_name": "gmapping"
    "name": "mapper0"
    # 地図の広さ [m] と格子の大きさ [m]。広すぎると粒子ごとの地図でメモリを食う
    "xmin": -10.0
    "ymin": -10.0
    "xmax": 10.0
    "ymax": 10.0
    "delta": 0.05
    "particles": 30
    # ロボットの中心から見た LiDAR の位置(mobile_sim の lidar.mount と同じにする)
    "laser_pose": { "x": 0.0, "y": 0.0, "theta": 0.0 }
    # 地図の画像を作り直す最短の間隔 [s]
    "map_update_interval": 2.0
    "processes":
      - "type_name": "gmapping_set_odometry"
        "name": "set_odometry0"
        "use_memo": false
        "subscribes":
          "odom": "odom"
      - "type_name": "gmapping_add_scan"
        "name": "add_scan0"
        "use_memo": false
        "subscribes":
          "scan": "scan"
      - "type_name": "gmapping_get_pose"
        "name": "get_pose0"
        "use_memo": false
      - "type_name": "gmapping_get_map"
        "name": "get_map0"
        "use_memo": false
      - "type_name": "gmapping_get_map_info"
        "name": "get_map_info0"
        "use_memo": false
      - "type_name": "gmapping_save_map"
        "name": "save_map0"
        "use_memo": false
      - "type_name": "gmapping_reset"
        "name": "reset0"
        "use_memo": false
      - "type_name": "gmapping_get_state"
        "name": "get_state0"
        "use_memo": false
"processes":
  - "type_name": "mapper_gmapping_version"
    "name": "version0"
