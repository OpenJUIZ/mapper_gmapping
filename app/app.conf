# mapper_gmapping の起動設定
#   先に mobile_sim を IPC 名 mobile_sim で動かしておく(juiz run mobile_sim、または juiz -f app.conf -d --ipc mobile_sim)
#   開発中: scripts/dev_plugin.sh build でプラグインを app/plugins/<target>/ に置いてから
#           juiz -f app/app.conf -d
#   mobile_sim のトピック odom(Pose2DStamped)と scan(LaserScan)を受けて地図を作る
"name": "mapper_gmapping"
"option":
  "http_broker":
    "start": true
    "port": 8001
    # ブラウザ画面(conf のディレクトリからの相対)
    "static_filepaths":
      "/": "web"
# mobile_sim からトピックを受けるため、こちらも IPC ブローカーを持つ
"brokers":
  - "type_name": "ipc"
    "name": "mapper_gmapping"
# mobile_sim につなぐ。package を書くと、juiz run は juizapp.yaml の depends の mobile_sim としてこれを使い、版を確かめる
# (別の機械の mobile_sim を使うときは juiz run --depend mobile_sim=http://<host>:8000)
"subsystems":
  - "package": "mobile_sim"
    "type_name": "ipc"
    "name": "mobile_sim"
"plugins":
  "components":
    "mapper_gmapping":
      "language": "c++"
      "path": "plugins/{target}"
"containers":
  # Transformations の Anchor。SLAM の地図の座標系
  - { "type_name": "static_anchor", "name": "map" }
  - "type_name": "gmapping"
    "name": "mapper0"
    # 推定した姿勢を、map から見た mapper0 の ContainerPose として書く(下の transforms の map -> mapper0)
    "map_frame": "map"
    # mobile_sim のトピック lidar_mount で LiDAR の取付位置を受け取るまで、スキャンを使わない
    "wait_laser_pose": true
    # 地図の広さ [m] と格子の大きさ [m]。広すぎると粒子ごとの地図でメモリを食う
    "xmin": -10.0
    "ymin": -10.0
    "xmax": 10.0
    "ymax": 10.0
    "delta": 0.05
    "particles": 30
    # ロボットの中心から見た LiDAR の位置。トピック lidar_mount が来ればそちらを使う
    "laser_pose": { "x": 0.0, "y": 0.0, "theta": 0.0 }
    # 地図の画像を作り直す最短の間隔 [s]
    "map_update_interval": 2.0
    "processes":
      - "type_name": "gmapping_set_odometry"
        "name": "set_odometry0"
        "use_memo": false
        "subscribes":
          "odom": "odom"
      - "type_name": "gmapping_add_scan"
        "name": "add_scan0"
        "use_memo": false
        "subscribes":
          "scan": "scan"
      - "type_name": "gmapping_set_laser_pose"
        "name": "set_laser_pose0"
        "use_memo": false
        "subscribes":
          "mount": "lidar_mount"
      - "type_name": "gmapping_get_pose"
        "name": "get_pose0"
        "use_memo": false
      - "type_name": "gmapping_get_map"
        "name": "get_map0"
        "use_memo": false
      - "type_name": "gmapping_get_map_info"
        "name": "get_map_info0"
        "use_memo": false
      - "type_name": "gmapping_save_map"
        "name": "save_map0"
        "use_memo": false
      - "type_name": "gmapping_reset"
        "name": "reset0"
        "use_memo": false
      - "type_name": "gmapping_get_state"
        "name": "get_state0"
        "use_memo": false
  # SLAM が推定したオドメトリの原点(map から見た odom0、ROS の map -> odom)。mapper0 の値を odom が来るたびに書く
  - "type_name": "gmapping_odom_frame"
    "name": "slam_odom0"
    "mapper": "mapper0"
    "map_frame": "map"
    "processes":
      - "type_name": "gmapping_odom_frame_update"
        "name": "odom_frame_update0"
        "use_memo": false
        "subscribes":
          "odom": "odom"
"processes":
  - "type_name": "mapper_gmapping_version"
    "name": "version0"
"transforms":
  # 値は mapper0 が SLAM の結果で書く
  - { "source": "map", "destination": "mapper0" }
  # 値は slam_odom0 が書く
  - { "source": "map", "destination": "slam_odom0" }
  # System をまたぐ Transform(juiz 0.2.1)。終点は mobile_sim の odom0 なので mobile_sim に作られ、mobile_sim が
  # slam_odom0 の位置を rate [Hz] で取りに来る。mobile_sim の中で map -> slam_odom0 -> odom0 -> robot0 -> lidar0 がつながる
  # (Docker では entrypoint.sh が ipc://mobile_sim を MOBILE_SIM_URL に置き換える)
  - { "source": "slam_odom0", "destination": "ipc://mobile_sim/container/odom0::static_anchor", "rate": 20.0 }
