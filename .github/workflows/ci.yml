name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUIZ_VERSION: "0.2.1"
  # 結合テストで動かす mobile_sim(Transformations と lidar_mount を持つ 0.3.0 以降)
  MOBILE_SIM_REF: claude/project-thread-ur68ns  # mobile_sim#25 (juiz 0.2.1) がマージされたら main に戻す

jobs:
  build:
    # 配る Linux 向けのプラグインは古めの glibc でビルドする(juiz の app-package.md §12.2)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch juiz_sdk
        run: echo "JUIZ_SDK_DIR=$(scripts/fetch_juiz_sdk.sh "$JUIZ_VERSION")" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$JUIZ_SDK_DIR"
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test with sanitizers
        # GMapping の木の解放とスキャンの解放を確かめる (時間のかかる SLAM のテストは --quick で飛ばす)
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DMAPPER_GMAPPING_BUILD_COMPONENT=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake --build build-asan --parallel
          (cd build-asan/tests && ./core_test --quick)
      - name: Install juiz
        # C++ のプラグインは C ABI なので、pip の juiz でも読める(rustc を揃えなくてよい)
        run: pip install "juiz-cli==$JUIZ_VERSION"
      - name: Smoke test
        run: |
          scripts/dev_plugin.sh build
          python3 scripts/smoke_test.py
      - name: Build mobile_sim
        run: |
          git clone --depth 1 --branch "$MOBILE_SIM_REF" https://github.com/OpenJUIZ/mobile_sim.git ../mobile_sim
          (cd ../mobile_sim && scripts/dev_plugin.sh --release)
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Integration and UI test with mobile_sim
        # mobile_sim を部屋で一周させ、トピックで受けた odom と scan から作った地図と姿勢を真の値と比べる。
        # 続けてブラウザ画面を Playwright で操作する
        run: |
          pip install pillow
          python3 -u scripts/integration_test.py --mobile-sim ../mobile_sim --out build/integration_map \
            --ui build/integration_map/ui_test.png
      - name: Upload the map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-map
          path: build/integration_map
          if-no-files-found: ignore
